server.port=8080


logging.level.com.demo.optionpricing=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=${catalina.base:../logs}/logs/option_explain.log

openai.api.model=${OPENAI_API_MODEL:gpt-4.1-nano}
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.enable-logging=true

# Enable/disable slider completely
demo.slider.enabled=true

# Optional: control slider range
demo.slider.minPercent=50
demo.slider.maxPercent=150

# Optional: debounce time for calling backend
demo.slider.debounceMs=300

# to resolve garbled chars in html
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true